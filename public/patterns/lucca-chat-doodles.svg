<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- Tile for the "Pergunte ao Lucca" chat background (used as a CSS mask: only the shape matters).
       Thin-line doodles on the manual's theme: tools, parts, manual, chat. Repeats seamlessly. -->

  <!-- wrench -->
  <g transform="translate(26 30) rotate(-35)">
    <path d="M-3 -16 a7 7 0 1 0 6 0 v5 h-6 z"/>
    <path d="M-2.5 -4 h5 v20 a2.5 2.5 0 0 1 -5 0 z"/>
  </g>

  <!-- gear -->
  <g transform="translate(92 24)">
    <circle r="8"/>
    <circle r="3"/>
    <path d="M0 -8 v-4 M0 8 v4 M-8 0 h-4 M8 0 h4 M5.7 -5.7 l2.8 -2.8 M-5.7 5.7 l-2.8 2.8 M5.7 5.7 l2.8 2.8 M-5.7 -5.7 l-2.8 -2.8"/>
  </g>

  <!-- screw -->
  <g transform="translate(150 30) rotate(20)">
    <path d="M-7 -12 h14 v4 h-14 z"/>
    <path d="M-1.5 -12 v4 M1.5 -12 v4"/>
    <path d="M-3.5 -8 v14 l3.5 6 l3.5 -6 v-14"/>
    <path d="M-3.5 -4 l7 2 M-3.5 1 l7 2"/>
  </g>

  <!-- chat bubble -->
  <g transform="translate(206 26)">
    <path d="M-14 -9 h28 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 h-16 l-7 6 v-6 h-5 a4 4 0 0 1 -4 -4 v-10 a4 4 0 0 1 4 -4 z"/>
    <circle cx="-6" cy="0" r="0.8"/>
    <circle cx="0" cy="0" r="0.8"/>
    <circle cx="6" cy="0" r="0.8"/>
  </g>

  <!-- hex nut -->
  <g transform="translate(58 76) rotate(10)">
    <path d="M0 -10 l8.7 5 v10 l-8.7 5 l-8.7 -5 v-10 z"/>
    <circle r="4"/>
  </g>

  <!-- open manual -->
  <g transform="translate(124 80) rotate(-8)">
    <path d="M0 -8 c-5 -3 -11 -3 -16 -1 v18 c5 -2 11 -2 16 1 z"/>
    <path d="M0 -8 c5 -3 11 -3 16 -1 v18 c-5 -2 -11 -2 -16 1"/>
    <path d="M-12 -3 c3 -1 6 -1 8 0 M-12 1 c3 -1 6 -1 8 0 M4 -3 c2 -1 5 -1 8 0 M4 1 c2 -1 5 -1 8 0"/>
  </g>

  <!-- lightbulb -->
  <g transform="translate(190 82) rotate(15)">
    <path d="M-6 3 a9 9 0 1 1 12 0 c-1.5 1.5 -2 3 -2 5 h-8 c0 -2 -0.5 -3.5 -2 -5 z"/>
    <path d="M-3.5 11 h7 M-2.5 14 h5"/>
    <path d="M0 -14 v-3 M11 -6 l2.5 -1.5 M-11 -6 l-2.5 -1.5"/>
  </g>

  <!-- hammer -->
  <g transform="translate(26 132) rotate(30)">
    <path d="M-10 -14 h16 l4 3 v3 h-20 z"/>
    <path d="M-2 -8 v24 h4 v-24"/>
  </g>

  <!-- ruler -->
  <g transform="translate(92 140) rotate(-25)">
    <rect x="-22" y="-5" width="44" height="10" rx="1.5"/>
    <path d="M-16 -5 v4 M-10 -5 v6 M-4 -5 v4 M2 -5 v6 M8 -5 v4 M14 -5 v6"/>
  </g>

  <!-- QR code -->
  <g transform="translate(160 136) rotate(8)">
    <rect x="-12" y="-12" width="24" height="24" rx="2"/>
    <rect x="-8" y="-8" width="6" height="6"/>
    <rect x="2" y="-8" width="6" height="6"/>
    <rect x="-8" y="2" width="6" height="6"/>
    <path d="M3 3 h2 M7 5 v3 M3 8 h2"/>
  </g>

  <!-- screwdriver -->
  <g transform="translate(214 150) rotate(-40)">
    <path d="M-3 -18 h6 v12 h-6 z"/>
    <path d="M-1.5 -14 v6 M1.5 -14 v6"/>
    <path d="M-1 -6 v18 l1 3 l1 -3 v-18"/>
  </g>

  <!-- drill bit / spiral -->
  <g transform="translate(56 198) rotate(-15)">
    <path d="M-2 -16 h4 v6 h-4 z"/>
    <path d="M-2 -10 l4 3 l-4 3 l4 3 l-4 3 l4 3 l-2 4"/>
  </g>

  <!-- bolt (lightning: power) -->
  <g transform="translate(120 196) rotate(12)">
    <path d="M2 -12 l-8 13 h6 l-2 11 l8 -13 h-6 z"/>
  </g>

  <!-- small gear -->
  <g transform="translate(184 204)">
    <circle r="5"/>
    <circle r="1.8"/>
    <path d="M0 -5 v-3 M0 5 v3 M-5 0 h-3 M5 0 h3 M3.5 -3.5 l2 -2 M-3.5 3.5 l-2 2 M3.5 3.5 l2 2 M-3.5 -3.5 l-2 -2"/>
  </g>

  <!-- fillers: sparkles, dots and plus signs -->
  <path d="M60 50 v6 M57 53 h6"/>
  <path d="M176 56 l1.5 3.5 l3.5 1.5 l-3.5 1.5 l-1.5 3.5 l-1.5 -3.5 l-3.5 -1.5 l3.5 -1.5 z"/>
  <path d="M8 90 v6 M5 93 h6"/>
  <path d="M232 108 v6 M229 111 h6"/>
  <path d="M128 112 l1.2 2.8 l2.8 1.2 l-2.8 1.2 l-1.2 2.8 l-1.2 -2.8 l-2.8 -1.2 l2.8 -1.2 z"/>
  <path d="M24 176 l1.2 2.8 l2.8 1.2 l-2.8 1.2 l-1.2 2.8 l-1.2 -2.8 l-2.8 -1.2 l2.8 -1.2 z"/>
  <path d="M152 176 v6 M149 179 h6"/>
  <path d="M226 228 l1.2 2.8 l2.8 1.2 l-2.8 1.2 l-1.2 2.8 l-1.2 -2.8 l-2.8 -1.2 l2.8 -1.2 z"/>
  <path d="M92 228 v6 M89 231 h6"/>
  <circle cx="40" cy="110" r="1"/>
  <circle cx="160" cy="104" r="1"/>
  <circle cx="200" cy="176" r="1"/>
  <circle cx="88" cy="176" r="1"/>
  <circle cx="18" cy="222" r="1"/>
  <circle cx="150" cy="226" r="1"/>
  <circle cx="232" cy="60" r="1"/>
</svg>
